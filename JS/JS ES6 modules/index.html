<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ES6 modules</title>
  </head>
  <body>
    <h1>JS ES6 Modules</h1>
    <!-- <script type="module" src="./JS/script1.js"></script> -->
    <script type="module" src="./JS/script2.js"></script>
    <!-- When we load script2.js as a module, the browser will see that it depends on script1.js and load the code from that file as well. -->
    <!-- When we use ESM, instead of adding every JavaScript file to our HTML in order, we only need to link a single file - the entry point, importer  depends on  exporter -->
  </body>
</html>
