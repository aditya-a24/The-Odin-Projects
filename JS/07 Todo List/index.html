<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <!-- <link rel="stylesheet" href="styles.css" /> -->
  </head>
  <body>
    <header>
      <h1>To-Do List App</h1>
    </header>

    <main>
      <section id="project-section">
        <h2>Projects</h2>
        <div id="project-list"></div>
        <input
          type="text"
          id="new-project-name"
          placeholder="New Project Name"
        />
        <button id="add-project-btn">Add Project</button>
      </section>

      <section id="todo-section">
        <h2>Todos</h2>
        <div id="todo-list"></div>
        <form id="todo-form">
          <input type="text" id="todo-title" placeholder="Title" required />
          <input type="text" id="todo-description" placeholder="Description" />
          <input type="date" id="todo-dueDate" required />
          <select id="todo-priority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
          <textarea id="todo-notes" placeholder="Notes"></textarea>
          <button type="submit">Add Todo</button>
        </form>
      </section>
    </main>

    <script src="./JS/index.js" type="module"></script>
  </body>
</html>
